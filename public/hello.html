<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact LottieFiles Hello Handwriting Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: clamp(280px, 80vw, 520px);
      aspect-ratio: 240 / 90;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .handwriting-stroke {
      fill: none;
      stroke: #000000;
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      will-change: stroke-dashoffset;
    }

    /* 
      5.0s Total Infinite Cycle Breakdown:
      0.0s – 2.2s (0% → 44%): Draw-in (L → 0) with cubic-bezier(0.65, 0, 0.35, 1)
      2.2s – 3.4s (44% → 68%): Hold stationary fully drawn (0 → 0)
      3.4s – 4.6s (68% → 92%): Trailing erase left-to-right (0 → -L)
      4.6s – 5.0s (92% → 100%): Blank pause before loop resets
    */
    @keyframes handwritingCycle {
      0% {
        stroke-dashoffset: var(--length, 1400px);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      44% {
        stroke-dashoffset: 0px;
        animation-timing-function: linear;
      }
      68% {
        stroke-dashoffset: 0px;
        animation-timing-function: linear;
      }
      92% {
        stroke-dashoffset: calc(-1 * var(--length, 1400px));
        animation-timing-function: linear;
      }
      100% {
        stroke-dashoffset: calc(-1 * var(--length, 1400px));
      }
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <svg viewBox="0 0 240 90">
      <!-- Continuous single-stroke bezier vector path matching exact LottieFiles reference cursive "hello" -->
      <path id="hello-stroke" class="handwriting-stroke" d="
        M 18 68 
        C 28 52, 42 22, 50 14 
        C 56 10, 58 18, 48 40 
        C 40 56, 38 68, 38 72 
        C 38 52, 54 44, 70 44 
        C 82 44, 84 62, 84 72 
        C 84 72, 98 54, 114 46 
        C 122 42, 124 54, 110 64 
        C 98 72, 108 72, 122 68 
        C 122 68, 144 32, 154 14 
        C 160 10, 162 18, 152 40 
        C 144 56, 142 68, 142 72 
        C 142 72, 164 32, 174 14 
        C 180 10, 182 18, 172 40 
        C 164 56, 162 68, 162 72 
        C 162 72, 176 52, 192 46 
        C 204 40, 212 56, 198 68 
        C 186 78, 174 66, 188 52 
        C 196 44, 215 48, 235 46
      " />
    </svg>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const path = document.getElementById("hello-stroke");
      if (path) {
        // Measure exact path length dynamically
        const length = path.getTotalLength();
        
        // Dynamically set stroke-dasharray and stroke-dashoffset CSS custom property
        path.style.setProperty("--length", `${length}px`);
        path.style.strokeDasharray = `${length}px`;
        path.style.strokeDashoffset = `${length}px`;
        
        // Start infinite keyframe animation cleanly
        path.style.animation = "handwritingCycle 5.0s infinite";
      }
    });
  </script>
</body>
</html>
