<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exact Reference Hello Handwriting Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: clamp(280px, 80vw, 500px);
      aspect-ratio: 280 / 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .handwriting-stroke {
      fill: none;
      stroke: #000000;
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      will-change: stroke-dashoffset;
    }

    /* 
      5.0s Total Infinite Cycle Breakdown:
      0.0s – 2.2s (0% → 44%): Draw-in (L → 0) with cubic-bezier(0.65, 0, 0.35, 1)
      2.2s – 3.4s (44% → 68%): Hold stationary fully drawn (0 → 0)
      3.4s – 4.6s (68% → 92%): Trailing erase left-to-right (0 → -L)
      4.6s – 5.0s (92% → 100%): Blank pause before loop resets
    */
    @keyframes handwritingCycle {
      0% {
        stroke-dashoffset: var(--length, 1300px);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      44% {
        stroke-dashoffset: 0px;
        animation-timing-function: linear;
      }
      68% {
        stroke-dashoffset: 0px;
        animation-timing-function: linear;
      }
      92% {
        stroke-dashoffset: calc(-1 * var(--length, 1300px));
        animation-timing-function: linear;
      }
      100% {
        stroke-dashoffset: calc(-1 * var(--length, 1300px));
      }
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <svg viewBox="0 0 280 100">
      <!-- Continuous single-stroke bezier vector path matching exact reference cursive "hello" -->
      <path id="hello-stroke" class="handwriting-stroke" d="
        M 20 75 
        C 28 62, 38 28, 48 18 
        C 56 12, 60 22, 50 42 
        C 44 54, 42 68, 42 80 
        C 42 62, 58 50, 72 50 
        C 82 50, 84 68, 84 80 
        C 84 80, 94 62, 106 50 
        C 114 42, 118 56, 108 68 
        C 98 78, 90 78, 102 72 
        C 102 72, 120 35, 132 18 
        C 140 12, 144 22, 134 42 
        C 128 54, 126 68, 126 80 
        C 126 80, 144 35, 156 18 
        C 164 12, 168 22, 158 42 
        C 152 54, 150 68, 150 80 
        C 150 80, 164 58, 178 50 
        C 190 42, 200 58, 190 72 
        C 180 84, 166 76, 178 58 
        C 184 48, 204 52, 226 50
      " />
    </svg>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const path = document.getElementById("hello-stroke");
      if (path) {
        // Measure exact path length dynamically
        const length = path.getTotalLength();
        
        // Dynamically set stroke-dasharray and stroke-dashoffset CSS custom property
        path.style.setProperty("--length", `${length}px`);
        path.style.strokeDasharray = `${length}px`;
        path.style.strokeDashoffset = `${length}px`;
        
        // Start infinite keyframe animation cleanly
        path.style.animation = "handwritingCycle 5.0s infinite";
      }
    });
  </script>
</body>
</html>
