<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursive Hello Handwriting Line-Drawing Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: clamp(280px, 80vw, 520px);
      aspect-ratio: 700 / 250;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .handwriting-stroke {
      fill: none;
      stroke: #000000;
      stroke-width: 8.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      will-change: stroke-dashoffset;
    }

    /* 
      5.4s Total Infinite Cycle Breakdown:
      0.0s – 2.2s (0% → 40.74%): Smooth draw-in (L → 0) with cubic-bezier(0.65, 0, 0.35, 1)
      2.2s – 3.2s (40.74% → 59.26%): Hold stationary fully drawn (0 → 0)
      3.2s – 5.0s (59.26% → 92.59%): Trailing erase left-to-right (0 → -L)
      5.0s – 5.4s (92.59% → 100%): Blank pause on clean white canvas before repeating
    */
    @keyframes handwritingCycle {
      0% {
        stroke-dashoffset: var(--length, 2300px);
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      40.74% {
        stroke-dashoffset: 0px;
        animation-timing-function: linear;
      }
      59.26% {
        stroke-dashoffset: 0px;
        animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }
      92.59% {
        stroke-dashoffset: calc(-1 * var(--length, 2300px));
        animation-timing-function: linear;
      }
      100% {
        stroke-dashoffset: calc(-1 * var(--length, 2300px));
      }
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <svg viewBox="0 0 700 250">
      <!-- Continuous single-stroke bezier vector path tracing cursive "hello" -->
      <path id="hello-stroke" class="handwriting-stroke" d="
        M 90,165 
        C 105,130 115,75 125,45 
        C 130,28 140,25 142,38 
        C 145,55 130,120 120,175 
        C 130,135 155,108 178,110 
        C 192,112 196,128 190,145 
        C 182,165 168,175 152,175 
        C 142,175 132,165 142,145 
        C 152,122 188,118 208,122 
        C 228,126 238,155 228,172 
        C 220,182 205,178 215,160 
        C 230,135 255,80 262,48 
        C 267,28 277,25 280,38 
        C 285,60 265,145 258,175 
        C 268,160 288,105 310,50 
        C 316,32 326,28 329,40 
        C 334,62 318,135 310,175 
        C 325,160 348,125 372,120 
        C 395,115 412,130 412,148 
        C 412,168 395,178 375,178 
        C 352,178 342,158 348,142 
        C 358,120 395,115 418,128 
        C 432,138 438,138 450,132
      " />
    </svg>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const path = document.getElementById("hello-stroke");
      if (path) {
        // Measure exact path length dynamically
        const length = path.getTotalLength();
        
        // Dynamically set stroke-dasharray and stroke-dashoffset CSS custom property
        path.style.setProperty("--length", `${length}px`);
        path.style.strokeDasharray = `${length}px`;
        path.style.strokeDashoffset = `${length}px`;
        
        // Start infinite keyframe animation cleanly
        path.style.animation = "handwritingCycle 5.4s infinite";
      }
    });
  </script>
</body>
</html>
